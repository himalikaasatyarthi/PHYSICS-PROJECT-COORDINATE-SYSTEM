
name: Build and Deploy Multiverse

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Create Website Build
        run: |
          mkdir -p public/wasm

          cp index.html public/
          cp -r css public/
          cp -r js public/
          cp -r assets public/

      - name: Compile C to WebAssembly
        run: |
          emcc c-engine/coordinates.c \
            -O3 \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME=createCoordinateModule \
            -s EXPORTED_FUNCTIONS='["_convertCoordinates","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","getValue","setValue"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -o public/wasm/coordinates.js

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
